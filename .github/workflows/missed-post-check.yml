name: Missed Post Check
on:
  schedule:
    - cron: '0 17 * * *'  # 17:00 UTC, ~4 hours after the normal 13:00 UTC schedule
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip3 install --break-system-packages requests

      - name: Check if today's post went out; if not, trigger recovery and verify it actually worked before emailing
        working-directory: reminders
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REMINDER_EMAIL_TO: ${{ secrets.REMINDER_EMAIL_TO }}
          REMINDER_EMAIL_FROM: ${{ secrets.REMINDER_EMAIL_FROM }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 check_missed_post.py
