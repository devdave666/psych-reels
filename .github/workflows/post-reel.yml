name: Post a reel (manual, one-off)

# Instagram-only one-off post of videos/<name>.mp4 using captions/<name>.txt. Manual trigger only; does not touch
# main/content.json or main/state.json.
on:
  workflow_dispatch:
    inputs:
      name:
        description: "Reel name (videos/<name>.mp4 and captions/<name>.txt)"
        required: true

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip3 install --break-system-packages requests

      - name: Wait until GitHub Pages serves the video
        env:
          REEL_NAME: ${{ inputs.name }}
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -I "https://devdave666.github.io/psych-reels/videos/${REEL_NAME}.mp4")
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "Video never became available" && exit 1

      - name: Post reel to Instagram
        working-directory: main
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          REEL_NAME: ${{ inputs.name }}
        run: python3 post_reel.py
